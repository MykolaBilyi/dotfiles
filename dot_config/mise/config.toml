[tools]
fzf = "latest"
starship = "latest"
aichat = { version = "latest", lazy = true }

[tool_alias]
fzf = "github:junegunn/fzf"
starship = "github:starship/starship"

[tools."github:junegunn/fzf"]
version = "latest"

[tools."github:junegunn/fzf".platforms]
linux-arm = { asset_pattern = "fzf-{{ version }}-{{ os() }}_armv7.tar.gz" }

[tools."github:starship/starship"]
version = "latest"

[tools."github:starship/starship".platforms]
linux-arm = { asset_pattern = "starship-{{ arch() }}-unknown-{{ os() }}-musleabihf.tar.gz" }

[shell_alias]
ll = "ls -alF"
aichat = "HYDRA_API_KEY=$(mise run --quiet get-llm-key aichat) aichat"

[task_templates."llm-secret"]
run = "echo ${LLM_API_KEY?}"
usage = '''
arg "<client>" help="Client name to lookup secret for"
'''
description = "Lookup LLM API key from secret-tool"

[tasks.get-llm-key]
extends = "llm-secret"
